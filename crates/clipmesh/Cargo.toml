[package]
name = "clipmesh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }

[dev-dependencies]
tempfile = "3"

# Mobile executable subprocesses cannot load desktop trust stores:
# rustls-native-certs treats iOS as generic Unix; Android's openssl-probe
# default points only at Termux. Retain verified TLS using Mozilla CA roots.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
