name: Build and verify ClipMesh
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux-x64
          path: target/release/clipmesh
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/build-macos.sh
      - run: bash platforms/ios/test-protocol.sh
      - run: brew install ldid dpkg
      - run: rustup target add aarch64-apple-ios
      - run: bash platforms/ios/build-native.sh
      - run: bash platforms/ios/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-iOS-rootless
          path: platforms/ios/build/clipmesh_0.3.0_iphoneos-arm64.deb
      - run: cargo build -p clipmesh
      - run: bash platforms/ios/test-transport.sh
      - run: bash platforms/ios/test-fallback.sh
      - run: bash platforms/ios/test-dashboard.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-macOS
          path: dist/ClipMesh-macOS.pkg*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: choco install innosetup --no-progress -y
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: ./dist/windows/ClipMesh.exe --protocol-self-test
        shell: pwsh
      - run: ./scripts/test-windows-lifecycle.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Windows
          path: dist/ClipMesh-Windows-Setup.exe*
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: sdkmanager 'ndk;27.3.13750724'
      - run: bash platforms/android/build-native.sh
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: platforms/android
      - uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Android-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
